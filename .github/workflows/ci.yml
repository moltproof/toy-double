# Derived from PalomarRegistry/PalomarTemplate's ci.yml (Apache-2.0) with the
# moltproof jobs `guard`, `audit` and `automerge` added. The Palomar jobs are
# kept as-is so the repository stays submittable to the registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Check metadata and Apache licence default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Test the metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Reject retained template values
        run: ruby scripts/validate-formalization.rb
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  submission-link:
    name: Check where the README sends a submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the submission form the README names
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not send a submitter to {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: that submission form was deleted; submissions go to {form}")
                      failed = True
          raise SystemExit(failed)
          PY

  sandbox:
    name: Check the Landrun wrapper's flag policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the Landrun wrapper
        run: ./test/landrun_wrapper_test.sh

  guard:
    name: Guard agent changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      needs_owner_review: ${{ steps.paths.outputs.needs_owner_review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the guard
        run: python3 test/guard_test.py
      - name: Forbidden tokens in agent files
        run: python3 scripts/guard.py tokens
      - name: Protected paths
        id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python3 scripts/guard.py paths --base "$BASE_SHA"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "needs_owner_review=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "needs_owner_review=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Label pull requests that touch protected paths
        if: github.event_name == 'pull_request' && steps.paths.outputs.needs_owner_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create needs-owner-review --color B60205 --force \
            --description "Touches the statement or the verification contract; the problem owner must review"
          gh pr edit "$PR_NUMBER" --add-label needs-owner-review

  build:
    name: Build with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true

  audit:
    name: Replay and audit declarations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: List audited modules
        id: modules
        run: |
          modules=$(python3 - <<'PY'
          import glob, pathlib, tomllib
          config = tomllib.loads(pathlib.Path("moltproof.toml").read_text())
          names = []
          for pattern in config["audit"]["module_globs"]:
              for path in sorted(glob.glob(pattern, recursive=True)):
                  names.append(".".join(pathlib.Path(path).with_suffix("").parts))
          print(" ".join(names))
          PY
          )
          echo "modules=$modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
      - name: Replay modules with leanchecker --fresh
        env:
          MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          for module in $MODULES; do
            echo "::group::leanchecker --fresh $module"
            time lake env leanchecker --fresh "$module"
            echo "::endgroup::"
          done
      - name: Audit declarations
        env:
          MODULES: ${{ steps.modules.outputs.modules }}
        run: lake env lean --run scripts/AuditDecls.lean --out status.json $MODULES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status
          path: status.json
          if-no-files-found: error

  comparator:
    name: Check statement against solution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Cache the pinned Comparator toolchain
        uses: actions/cache@v4
        with:
          path: .cache/palomar-comparator
          key: palomar-comparator-${{ hashFiles('scripts/verify-comparator.sh', 'lean-toolchain') }}
      - name: Run pinned Comparator toolchain
        run: ./scripts/verify-comparator.sh

  automerge:
    name: Merge verified agent pull request
    runs-on: ubuntu-latest
    needs: [license, submission-link, sandbox, guard, build, audit]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == vars.MOLTPROOF_BOT_LOGIN &&
      needs.guard.outputs.needs_owner_review == 'false'
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.MOLTPROOF_APP_ID }}
          private-key: ${{ secrets.MOLTPROOF_APP_PRIVATE_KEY }}
      - name: Merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
