# Derived from PalomarRegistry/PalomarTemplate's ci.yml (Apache-2.0). The Palomar
# jobs (license, submission-link, build, docs, comparator) and the preamble are
# kept verbatim, except for the package name in `docs`, so the repository stays
# submittable to the registry; `tools/check_palomar_upstream.py` in the moltproof
# monorepo checks that against the pinned upstream commit. The moltproof jobs
# are `guard`, `audit` and `automerge`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Check metadata and Apache licence default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Test the metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Check the canonical template sentinel surface
        if: github.repository == 'PalomarRegistry/PalomarTemplate'
        run: ruby scripts/validate-formalization.rb --expect-template
      - name: Reject retained template values in a derived repository
        if: github.repository != 'PalomarRegistry/PalomarTemplate'
        run: ruby scripts/validate-formalization.rb
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  submission-link:
    name: Check where the README sends a submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the submission form the README names
        # Require the current destination as well as rejecting the retired one;
        # a missing or misspelt link would pass a negative-only check. Limit the
        # rejection to Palomar's form because other issue trackers are valid.
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not send a submitter to {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: that submission form was deleted; submissions go to {form}")
                      failed = True
          raise SystemExit(failed)
          PY

  guard:
    name: Guard agent changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      needs_owner_review: ${{ steps.paths.outputs.needs_owner_review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the guard
        run: python3 test/guard_test.py
      - name: Forbidden tokens in agent files
        run: python3 scripts/guard.py tokens
      - name: Protected paths
        id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python3 scripts/guard.py paths --base "$BASE_SHA"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "needs_owner_review=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "needs_owner_review=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Label pull requests that touch protected paths
        if: github.event_name == 'pull_request' && steps.paths.outputs.needs_owner_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create needs-owner-review --color B60205 --force \
            --description "Touches the statement or the verification contract; the problem owner must review"
          gh pr edit "$PR_NUMBER" --add-label needs-owner-review

  build:
    name: Build with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true

  docs:
    name: Build API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Build doc-gen4 output
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
          DISABLE_EQUATIONS: "1"
          DOCGEN_SRC: github
        run: lake build ToyDouble:docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-documentation
          path: docbuild/.lake/build/doc
          if-no-files-found: error

  audit:
    name: Replay and audit declarations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: List audited modules
        id: modules
        run: |
          modules=$(python3 - <<'PY'
          import glob, pathlib, tomllib
          config = tomllib.loads(pathlib.Path("moltproof.toml").read_text())
          names = []
          for pattern in config["audit"]["module_globs"]:
              for path in sorted(glob.glob(pattern, recursive=True)):
                  names.append(".".join(pathlib.Path(path).with_suffix("").parts))
          print(" ".join(names))
          PY
          )
          echo "modules=$modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
      # `--fresh` re-checks every constant in the import closure, Mathlib
      # included, and accepts a single module, so it runs once on `Solution`
      # (which imports the package). The incremental replay then re-checks the
      # declarations of every audited module, including lemma files outside
      # that closure, against their imports.
      - name: Replay Solution and its imports with leanchecker --fresh
        run: time lake env leanchecker --fresh Solution
      - name: Replay audited modules with leanchecker
        env:
          MODULES: ${{ steps.modules.outputs.modules }}
        run: time lake env leanchecker $MODULES
      - name: Audit declarations
        env:
          MODULES: ${{ steps.modules.outputs.modules }}
        run: lake env lean --run scripts/AuditDecls.lean --out status.json $MODULES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: status
          path: status.json
          if-no-files-found: error

  comparator:
    name: Check statement against solution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the toolchain's lake comparator
        run: ./scripts/verify-comparator.sh

  automerge:
    name: Merge verified agent pull request
    runs-on: ubuntu-latest
    # Neither `comparator` nor `docs` gates a lemma merge: the statement is
    # unsolved (comparator red) until the final proof lands.
    needs: [license, submission-link, guard, build, audit]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == vars.MOLTPROOF_BOT_LOGIN &&
      needs.guard.outputs.needs_owner_review == 'false'
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MOLTPROOF_APP_ID }}
          private-key: ${{ secrets.MOLTPROOF_APP_PRIVATE_KEY }}
      - name: Merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
